ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom   # IMPORTANT

    # Wheel odometry (velocity only)
    odom0: /crobot_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    #VSLAM as absolute pose input
    pose0: /visual_slam/tracking/odometry
    pose0_config:
        [true, true, false,
        false, false, true,
        false, false, false,
        false, false, false,
        false, false, false]
    pose0_relative: false
    #if vslam jumps more than 2 meters, reject it
    pose0_rejection_threshold: 0.5   # rejects teleports automatically

    # IMU (yaw + angular velocity)
    # imu0: /camera0/imu
    # imu0_config: [false, false, false,
    #               false, false, true,
    #               false, false, false,
    #               false, false, true,
    #               false, false, false]
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true