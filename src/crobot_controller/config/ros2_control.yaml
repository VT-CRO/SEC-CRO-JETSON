controller_manager:
  ros__parameters:
    update_rate: 30
    
    crobot_drive_controller:
      type: crobot_controller/CrobotDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    gpio_controller:
      type: gpio_controllers/GpioCommandController

crobot_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "back_left_wheel_joint"
    rear_right_wheel_command_joint_name: "back_right_wheel_joint"

    deadwheel_x_state_name: deadwheel_odom/deadwheel_odom_x
    deadwheel_y_state_name: deadwheel_odom/deadwheel_odom_y
    deadwheel_heading_state_name: deadwheel_odom/deadwheel_odom_heading

    kinematics:
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.25

gpio_controller:
  ros__parameters:
    gpios:
      - crobot_systems
    command_interfaces:
      crobot_systems:
        - interfaces:
          - bin_intake
          - beacon
          - start_robot
          # - start_led