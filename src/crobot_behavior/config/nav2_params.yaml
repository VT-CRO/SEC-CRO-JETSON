controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    odom_topic: odometry/filtered

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController" 
      angular_dist_threshold: 0.785 
      forward_sampling_distance: 0.5 
      rotate_to_heading_angular_vel: 2.5
      max_angular_accel: 3.5
      simulate_ahead_time: 1.0
      
      time_steps: 70
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0          
      wz_std: 0.3
      vx_max: 0.5
      vx_min: -0.10
      wz_min: 0.0
      vy_max: 0.0         
      vy_min: -0.0
      wz_max: 2.5
      az_max: 4.0
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      publish_optimal_trajectory: true
      visualize: true       
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        use_path_orientations: false  
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 25
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0   
        mode: 0  
      ObstaclesCritic:
        consider_footprint: true
        repulsion_weight: 1.5
        near_goal_distance: 0.5
      

bt_navigator:
  ros__parameters:
    use_sim_time: false
    #CHANGE THIS TO odometry/filtered if using EKF
    #else, crobot_drive_controller/odom
    odom_topic: odometry/filtered
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ['navigate_through_poses', 'navigate_to_pose']
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"

goal_checker:
  ros__parameters:
    plugin: "nav2_controller::SimpleGoalChecker"
    xy_goal_tolerance: 0.15      # within 15cm of goal
    yaw_goal_tolerance: 0.25     # ~14 degrees
    stateful: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05       
      footprint: "[[-0.1524, -0.1524], [-0.1524, 0.1524], [0.2413, 0.1524], [0.2413, -0.1524]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        # scan:
        #   topic: /scan
        #   max_obstacle_height: 2.0
        #   clearing: true
        #   marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.05 # radius of inflation around obstacles. Lower = less inflation but higher chance of accidental collision
        cost_scaling_factor: 0.5  # higher = steeper dropoff from obstacles

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.03
      footprint: "[[-0.1524, -0.1524], [-0.1524, 0.1524], [0.19685, 0.1524], [0.19685, -0.1524]]"
      rolling_window: true
      width: 3          # ← size of local window in meters
      height: 3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.2
        cost_scaling_factor: 1.0  # higher = steeper dropoff from obstacles

