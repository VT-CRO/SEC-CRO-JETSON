ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true #ignores z, roll and pitch
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    #vslam should around publish map, so this should only update odom.
    world_frame: odom

    # cmd_vel odometry
    odom0: /crobot_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    #ignores large velocity and pose jumps
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 1.0

    # VSLAM as absolute pose input
    pose0: /visual_slam/tracking/odometry
    pose0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_relative: true
    #if vslam jumps more than 2 meters, reject it
    pose0_rejection_threshold: 2.0   # rejects teleports automatically