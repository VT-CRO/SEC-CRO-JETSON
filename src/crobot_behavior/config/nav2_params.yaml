#IRL PARAMETERS
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    max_velocity: [0.10, 0.0, 1.5]      # [x, y, theta]
    min_velocity: [-0.15, 0.0, -1.5]
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    #CHANGE THIS TO odometry/filtered if using EKF
    odom_topic: odometry/filtered
    odom_duration: 0.1

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      # - amcl
      - planner_server
      - controller_server
      - bt_navigator
      - velocity_smoother

slam_toolbox:
  ros__parameters:
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    odom_topic: odometry/filtered