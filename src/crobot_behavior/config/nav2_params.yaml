amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    min_particles: 500
    max_particles: 2000
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_max_beams: 60
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    transform_tolerance: 0.5

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/ros/ws/src/crobot_gazebo/field/map.yaml"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
    # use_sim_time: false
    # expected_planner_frequency: 2.0
    # planner_plugins: ["GridBased"]
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlannerHybrid"
    #   minimum_turning_radius: 0.3    # your robot's tightest Ackermann turn
    #   allow_reverse_expansion: true  # lets it plan backward paths
    #   smooth_path: true
    #   motion_model_for_search: "REEDS_SHEPP"  # allows forward + reverse + turns

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    #CHANGE THIS TO odometry/filtered if using EKF
    odom_topic: odometry/filtered


    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 5.0
      rotate_to_heading_angular_vel: 1.0
      use_velocity_scaled_lookahead_dist: true
      max_linear_accel: 10.0
      max_linear_decel: 10.0
      
      lookahead_dist: 0.8          # was 0.6, increase for faster movement
      min_lookahead_dist: 0.4      # was 0.3
      max_lookahead_dist: 1.2      # was 0.9
      lookahead_time: 1.5

      use_rotate_to_heading: true 
      rotate_to_heading_min_angle: 0.8 # radians (~23°) before it bothers rotating
      rotate_to_heading_angular_vel:  0.8  # faster rotation
      max_angular_accel: 1.0
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      

bt_navigator:
  ros__parameters:
    use_sim_time: false
    #CHANGE THIS TO odometry/filtered if using EKF
    #else, crobot_drive_controller/odom
    odom_topic: odometry/filtered

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05       
      footprint: "[[-0.1524, -0.125], [-0.1524, 0.125], [0.1524, 0.125], [0.1524, -0.125]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        # scan:
        #   topic: /scan
        #   max_obstacle_height: 2.0
        #   clearing: true
        #   marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.1 # radius of inflation around obstacles. Lower = less inflation but higher chance of accidental collision
        cost_scaling_factor: 1.0  # higher = steeper dropoff from obstacles

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.03
      footprint: "[[-0.1524, -0.125], [-0.1524, 0.125], [0.1524, 0.125], [0.1524, -0.125]]"
      rolling_window: true
      width: 3          # ← size of local window in meters
      height: 3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.2
        cost_scaling_factor: 5.0  # higher = steeper dropoff from obstacles

